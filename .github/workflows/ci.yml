name: CI

# Manual trigger only — no automatic run on push or pull_request, and no
# weekly schedule. This is a deliberate project-owner decision (recorded in
# docs/PROGRESS.md and docs/TO-DO.md T-210), not the rebuild's original
# design (docs/REBUILD_DIRECTIVE.md §6/A1 specified push/PR + a weekly
# Servo-release cron; both are gone here). Use the "Run workflow" button in
# the Actions tab for every run, including a Servo release.
on:
  workflow_dispatch: {}

jobs:
  # ─────────────────────────────────────────────────────────────
  # Job 1: Build, lint, test. macOS only, by project-owner decision — the
  # rebuild's original ubuntu+windows+macos matrix is gone; this repo
  # develops and ships macOS-only for now. Servo-free (default feature
  # set) — docs/REBUILD_DIRECTIVE.md §7.1: "Servo is optional and off by
  # default." The real-Servo build lives in Job 2, also manual-only.
  # ─────────────────────────────────────────────────────────────
  ci:
    name: Build, Lint & Test (macOS)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          brew update
          brew install cmake pkg-config openssl sqlite

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: macos

      - name: Fetch dependencies
        run: cargo fetch

      - name: Check formatting
        run: cargo fmt --all --check

      # --all-targets: the pre-A1 CI omitted this and so never linted test
      # code at all (docs/TO-DO.md T-207 — that hid a real clippy error for
      # months). Do not drop it again.
      - name: Clippy (zero warnings, all targets)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Unused dependencies (cargo-machete)
        run: |
          cargo install cargo-machete --locked
          cargo machete

      # EmbarkStudios/cargo-deny-action@v2 is a Docker container action —
      # GitHub Actions only supports container actions on Linux runners,
      # so it fails outright ("Container action is only supported on
      # Linux") the moment this job's matrix is macOS-only. Native
      # install + run instead, the same pattern cargo-machete above
      # already uses, which works on any runner OS.
      - name: License / advisory / duplicate-version audit (cargo-deny)
        run: |
          cargo install cargo-deny --locked
          cargo deny check

      - name: Doc-drift checks
        run: |
          sh scripts/check_purge.sh
          sh scripts/check_no_archive_links.sh

      - name: Run tests
        run: cargo test --workspace

      - name: Build (default features, no Servo)
        run: cargo build --release -p ferrite-shell

  # ─────────────────────────────────────────────────────────────
  # Job 2: Build the REAL Servo-enabled binary and publish the rolling
  # "latest" release. Manual-only (workflow_dispatch), macOS only —
  # docs/REBUILD_DIRECTIVE.md §7.1: the Servo build costs tens of GB and
  # 30-60 minutes; this project's owner has decided no automatic trigger
  # (push, PR, or schedule) gets to pay that cost — every run, including a
  # release, is an explicit "Run workflow" click.
  # ─────────────────────────────────────────────────────────────
  build-servo-release:
    name: Build Servo release (macOS)
    runs-on: macos-latest
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          brew update
          brew install cmake pkg-config openssl gstreamer sqlite

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: servo-macos

      - name: Build release binary (with Servo)
        run: cargo build --release -p ferrite-shell --features ferrite-servo/servo

      - name: Derive binary label
        id: label
        shell: bash
        run: |
          SHA="${{ github.sha }}"
          echo "binary_label=${SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Stage executable
        shell: bash
        run: |
          LABEL="${{ steps.label.outputs.binary_label }}"
          mkdir -p staged
          cp "target/release/ferrite-shell" "staged/ferrite-${LABEL}-macos"

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: ferrite-${{ steps.label.outputs.binary_label }}-macos
          path: staged/
          retention-days: 90

  # ─────────────────────────────────────────────────────────────
  # Job 3: Publish the rolling "latest" GitHub Release from the manual
  # Servo build above. Every run replaces the previous "latest" release's
  # assets; full history is preserved via the commit SHA baked into the
  # filename.
  # ─────────────────────────────────────────────────────────────
  release:
    name: Publish rolling release
    runs-on: ubuntu-22.04
    needs: build-servo-release
    if: github.event_name == 'workflow_dispatch'

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive binary label
        id: label
        shell: bash
        run: |
          SHA="${{ github.sha }}"
          echo "binary_label=${SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: ferrite-${{ steps.label.outputs.binary_label }}-macos
          path: downloaded/macos

      - name: Build release notes
        id: notes
        shell: bash
        run: |
          LABEL="${{ steps.label.outputs.binary_label }}"
          SHA="${{ github.sha }}"
          SHORT="${SHA:0:7}"
          DATE=$(date -u +"%Y-%m-%d %H:%M UTC")

          cat <<EOF > release_notes.md
          ## ferrite · latest

          > This release is built manually only (workflow_dispatch) — no
          > automatic push, PR, or schedule trigger. It always contains the
          > most recent manually-triggered build, which may be behind
          > \`main\`.

          | Field   | Value |
          |---------|-------|
          | Label   | \`$LABEL\` |
          | Commit  | [\`$SHORT\`](https://github.com/${{ github.repository }}/commit/$SHA) |
          | Date    | $DATE |

          ### Downloads
          | Platform | File |
          |----------|------|
          | macOS    | \`ferrite-${LABEL}-macos\` |
          EOF

      - name: Delete existing "latest" tag (if any)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "ferrite · latest build"
          body_path: release_notes.md
          prerelease: true
          make_latest: true
          files: |
            downloaded/macos/ferrite-${{ steps.label.outputs.binary_label }}-macos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
