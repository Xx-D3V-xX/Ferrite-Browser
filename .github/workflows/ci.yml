name: CI
run-name: CI${{ inputs.only_media && ' (media builds only, no release)' || '' }}

# Manual trigger only — no automatic run on push or pull_request, and no
# schedule. A project-owner decision (docs/TO-DO.md T-210), not the rebuild's
# original design. Use "Run workflow" in the Actions tab. A run that succeeds
# end to end (every job, on every OS) triggers release.yml, which publishes
# the packages this run built.
on:
  workflow_dispatch:
    inputs:
      only_media:
        description: "Run only the media packaging jobs (to test them quickly). Never publishes a release."
        type: boolean
        default: false
      only_smoke:
        description: "With only_media: run only the two quick bundle smoke tests, not the Servo builds."
        type: boolean
        default: false

jobs:
  # ─────────────────────────────────────────────────────────────
  # Job 1: build, lint, test on Linux, Windows and macOS. Servo-free (default
  # feature set) — docs/REBUILD_DIRECTIVE.md §7.1: "Servo is optional and off
  # by default". The real-Servo build is job 2.
  # ─────────────────────────────────────────────────────────────
  ci:
    name: Build, Lint & Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    if: ${{ !inputs.only_media }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            name: Linux
          - os: windows-latest
            platform: windows
            name: Windows
          - os: macos-latest
            platform: macos
            name: macOS

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config libssl-dev libsqlite3-dev \
            libfontconfig1-dev libfreetype-dev libxkbcommon-dev \
            libx11-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libwayland-dev libegl1-mesa-dev libgl1-mesa-dev libvulkan-dev libudev-dev

      - name: Install system dependencies (macOS)
        if: matrix.platform == 'macos'
        run: |
          brew update
          brew install cmake pkg-config openssl sqlite

      - name: Install system dependencies (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          choco install -y cmake sqlite

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}

      - name: Fetch dependencies
        run: cargo fetch

      # Formatting, dependency audits and doc-drift checks do not depend on the
      # platform, so they run once, on Linux.
      - name: Check formatting
        if: matrix.platform == 'linux'
        run: cargo fmt --all --check

      # --all-targets: the pre-A1 CI omitted this and so never linted test
      # code at all (docs/TO-DO.md T-207 — that hid a real clippy error for
      # months). Do not drop it again.
      - name: Clippy (zero warnings, all targets)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Unused dependencies (cargo-machete)
        if: matrix.platform == 'linux'
        run: |
          cargo install cargo-machete --locked
          # Only our own crates: vendor/ holds upstream Servo code whose
          # dependency list is not ours to prune (machete misses macro uses).
          cargo machete crates

      # Native install rather than EmbarkStudios/cargo-deny-action: that action
      # is a Docker container action (Linux runners only), and installing the
      # tool the way cargo-machete is installed keeps this step portable.
      - name: License / advisory / duplicate-version audit (cargo-deny)
        if: matrix.platform == 'linux'
        run: |
          cargo install cargo-deny --locked
          cargo deny check

      - name: Doc-drift checks
        if: matrix.platform == 'linux'
        run: |
          sh scripts/check_purge.sh
          sh scripts/check_no_archive_links.sh

      - name: Run tests
        run: cargo test --workspace

      - name: Build (default features, no Servo)
        run: cargo build --release -p ferrite-shell

  # ─────────────────────────────────────────────────────────────
  # Job 2: build the REAL Servo-enabled binary for each OS and package it
  # (scripts/package.sh: .app on macOS, .zip on Windows, .tar.gz on Linux).
  # It costs tens of GB and 30-60 minutes per OS (docs/REBUILD_DIRECTIVE.md
  # §7.1), so it only runs after job 1 passed everywhere. The packages are
  # uploaded as artifacts; release.yml publishes them once this whole run
  # has succeeded.
  # ─────────────────────────────────────────────────────────────
  # Audio, video and WebRTC through GStreamer (the `media` feature). Linux only, and
  # informational: it does not hold up a release, because the release builds do not
  # include GStreamer (it must be installed next to the app to use it).
  check-media-linux:
    name: Media probe (Linux, GStreamer)
    runs-on: ubuntu-latest
    needs: ci
    if: ${{ !inputs.only_media }}
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake ninja-build pkg-config gperf python3 m4 \
            libssl-dev libsqlite3-dev libfontconfig1-dev libfreetype-dev \
            libharfbuzz-dev liblzma-dev libxkbcommon-dev libx11-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libwayland-dev libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev \
            libvulkan-dev libudev-dev libdbus-1-dev libglib2.0-dev libunwind-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav \
            gstreamer1.0-nice

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: servo-media-linux

      - name: Run the media probe
        run: cargo run -p ferrite-servo --features servo,media --example media_probe

      - name: Run the capture probe (camera, microphone, screen sharing)
        run: cargo run -p ferrite-servo --features servo,media --example capture_probe

      - name: Run the Media Source Extensions probe
        run: |
          sudo apt-get install -y --no-install-recommends xvfb
          xvfb-run -a cargo run -p ferrite-servo --features servo,media --example mse_probe

      - name: Run the capture probe against a real screen (X11)
        run: |
          sudo apt-get install -y --no-install-recommends xvfb
          FERRITE_PROBE_REAL_SCREEN=1 xvfb-run -a -s "-screen 0 1280x800x24" \
            cargo run -p ferrite-servo --features servo,media --example capture_probe

  build-servo-release:
    name: Build Servo release (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    needs: ci
    if: ${{ !inputs.only_media }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            name: Linux
            binary: ferrite-shell
          - os: windows-latest
            platform: windows
            name: Windows
            binary: ferrite-shell.exe
          - os: macos-latest
            platform: macos
            name: macOS
            binary: ferrite-shell

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake ninja-build pkg-config gperf python3 m4 \
            libssl-dev libsqlite3-dev libfontconfig1-dev libfreetype-dev \
            libharfbuzz-dev liblzma-dev libxkbcommon-dev libx11-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libwayland-dev libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev \
            libvulkan-dev libudev-dev libdbus-1-dev libglib2.0-dev libunwind-dev

      - name: Install system dependencies (macOS)
        if: matrix.platform == 'macos'
        run: |
          brew update
          brew install cmake pkg-config openssl gstreamer sqlite

      - name: Install system dependencies (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          choco install -y cmake sqlite

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: servo-${{ matrix.platform }}

      - name: Build release binary (with Servo)
        run: cargo build --release -p ferrite-shell --features ferrite-servo/servo

      - name: Derive label
        id: label
        shell: bash
        run: |
          SHA="${{ github.sha }}"
          echo "label=${SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Package
        shell: bash
        run: |
          bash scripts/package.sh "${{ matrix.platform }}" "${{ steps.label.outputs.label }}" \
            "target/release/${{ matrix.binary }}" dist

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ferrite-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 90

  # The same release with video and audio (the `media` feature): macOS and Windows
  # packages carry their own GStreamer (scripts/bundle-gstreamer.py), the Linux one uses
  # the system's. Experimental and unable to hold up the release: if this job fails, the
  # normal packages above are published without it. release.yml attaches whichever
  # `ferrite-media-*` artifacts exist.
  build-servo-media-release:
    name: Build Servo media release (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    needs: ci
    # `ci` is skipped in a media-only run; a real failure of it still stops this job.
    if: ${{ !inputs.only_smoke && !cancelled() && (needs.ci.result == 'success' || needs.ci.result == 'skipped') }}
    continue-on-error: true

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            name: Linux
            binary: ferrite-shell
          - os: windows-latest
            platform: windows
            name: Windows
            binary: ferrite-shell.exe
          - os: macos-latest
            platform: macos
            name: macOS
            binary: ferrite-shell

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake ninja-build pkg-config gperf python3 m4 \
            libssl-dev libsqlite3-dev libfontconfig1-dev libfreetype-dev \
            libharfbuzz-dev liblzma-dev libxkbcommon-dev libx11-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libwayland-dev libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev \
            libvulkan-dev libudev-dev libdbus-1-dev libglib2.0-dev libunwind-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev

      - name: Install system dependencies (macOS)
        if: matrix.platform == 'macos'
        run: |
          brew update
          brew install cmake pkg-config openssl gstreamer sqlite
          # The ICE plugin WebRTC needs; not part of the gstreamer formula.
          brew install libnice-gstreamer || echo "no libnice-gstreamer formula: WebRTC will lack ICE"

      - name: Install system dependencies (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          choco install -y cmake sqlite pkgconfiglite gstreamer gstreamer-devel
          # The package installs under Program Files, not C:\gstreamer; the installer
          # records where in a machine-wide variable.
          $root = [Environment]::GetEnvironmentVariable('GSTREAMER_1_0_ROOT_MSVC_X86_64','Machine')
          if (-not $root) { $root = 'C:\Program Files\gstreamer\1.0\msvc_x86_64' }
          $root = $root.TrimEnd('\')
          if (-not (Test-Path "$root\lib\pkgconfig\glib-2.0.pc")) { throw "GStreamer's pkg-config files are not under $root" }
          "GSTREAMER_1_0_ROOT_MSVC_X86_64=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PKG_CONFIG_PATH=$root\lib\pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "$root\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          # Fail here, in a minute, not an hour into the build.
          $env:PKG_CONFIG_PATH = "$root\lib\pkgconfig"
          pkg-config --print-errors --modversion glib-2.0
          if ($LASTEXITCODE -ne 0) { throw "pkg-config cannot find GLib" }
          pkg-config --libs gstreamer-1.0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: servo-media-${{ matrix.platform }}

      - name: Build release binary (with Servo and media)
        run: cargo build --release -p ferrite-shell --features ferrite-servo/servo,ferrite-servo/media

      - name: Derive label
        id: label
        shell: bash
        run: |
          SHA="${{ github.sha }}"
          echo "label=${SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Package
        shell: bash
        run: |
          bash scripts/package.sh "${{ matrix.platform }}" "${{ steps.label.outputs.label }}" \
            "target/release/${{ matrix.binary }}" dist media

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ferrite-media-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 90

      # The real engine, from a real bundle, on a Mac: the media and MSE probes (video,
      # audio, a WebRTC data channel, Media Source Extensions) are bundled the way the app
      # is and run twice, with Homebrew installed (as on a developer's Mac) and moved away.
      # A second GLib in the process ("implemented in both"), a panic or a failed check
      # fails the step. This is what the smoke test (GStreamer's own tool) cannot see.
      - name: Run the engine's media probes from a bundle (macOS)
        if: matrix.platform == 'macos'
        run: |
          cargo build --release -p ferrite-servo --features servo,media --example media_probe --example mse_probe
          app="$RUNNER_TEMP/e2e/Ferrite.app"
          rm -rf "$RUNNER_TEMP/e2e"; mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp target/release/examples/media_probe target/release/examples/mse_probe "$app/Contents/MacOS/"
          python3 scripts/bundle-gstreamer.py macos "$app" --main media_probe --extra mse_probe
          bad=""
          run_probe() {   # $1 = label, $2 = probe
            set +e
            "$app/Contents/MacOS/$2" > "$RUNNER_TEMP/$2.log" 2>&1
            local code=$?
            set -e
            grep -E "^(PASS|FAIL)|passed, |panicked|PANIC|GStreamer bundle|implemented in both" "$RUNNER_TEMP/$2.log" | tail -60
            if grep -q "implemented in both" "$RUNNER_TEMP/$2.log"; then echo "$1: TWO COPIES OF A LIBRARY IN ONE PROCESS"; bad=1; fi
            if grep -qE "panicked|PANIC" "$RUNNER_TEMP/$2.log"; then echo "$1: A PANIC"; bad=1; fi
            if [ "$code" -ne 0 ]; then echo "$1: $2 exited with $code"; tail -20 "$RUNNER_TEMP/$2.log"; bad=1; fi
            echo "=== $1: $2 exit $code"
          }
          # Every library the engine loads, and any loaded twice (two copies of a GObject
          # library give "expected X, got X" type errors, as WebRTC data channels did).
          DYLD_PRINT_LIBRARIES=1 "$app/Contents/MacOS/media_probe" > /dev/null 2> "$RUNNER_TEMP/dyld-media.txt" || true
          grep -oE "/[^ ]+\.dylib" "$RUNNER_TEMP/dyld-media.txt" | grep -iE "gst|glib|gobject|gio|nice|srtp|ssl|crypto" | sort -u > "$RUNNER_TEMP/gst-images.txt"
          echo "--- GStreamer/GLib images loaded: $(wc -l < "$RUNNER_TEMP/gst-images.txt")"
          cat "$RUNNER_TEMP/gst-images.txt"
          echo "--- loaded more than once (same file name, different path):"
          sed 's#.*/##' "$RUNNER_TEMP/gst-images.txt" | sort | uniq -d
          run_probe "Homebrew present" media_probe
          run_probe "Homebrew present" mse_probe
          sudo mv /opt/homebrew /opt/homebrew.hidden
          run_probe "Homebrew hidden" media_probe
          run_probe "Homebrew hidden" mse_probe
          sudo mv /opt/homebrew.hidden /opt/homebrew
          [ -z "$bad" ]

  # Tests scripts/bundle-gstreamer.py without building Servo (which takes an hour). It
  # bundles GStreamer's own gst-inspect-1.0 the way a release bundles the app, then does
  # what Servo does at start-up (`media_platform::init`): loads EVERY plugin on Servo's list,
  # by file path, from the bundle's directory, with nothing scanned. If one will not load
  # Servo ends the app with exit(1) and says nothing, which is how the first -media macOS
  # build failed. It does this twice: with Homebrew still installed (as on a developer's
  # Mac: nothing may load from it) and with Homebrew moved away.
  bundle-smoke-macos:
    name: GStreamer bundle smoke test (macOS)
    runs-on: macos-latest
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GStreamer
        run: |
          brew update
          brew install gstreamer
          brew install libnice-gstreamer || echo "no libnice-gstreamer formula"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Bundle, load Servo's plugins from it, with and without Homebrew
        run: |
          python3 scripts/bundle-gstreamer.py self-test
          app="$PWD/smoke/Ferrite.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp "$(brew --prefix)/bin/gst-inspect-1.0" "$app/Contents/MacOS/gst-inspect"
          python3 scripts/bundle-gstreamer.py macos "$app" --main gst-inspect
          libdir="$app/Contents/MacOS/lib"
          python3 scripts/bundle-gstreamer.py list macos > "$RUNNER_TEMP/plugins.txt"
          echo "--- size"; du -sh "$app"
          echo "--- Servo lists $(wc -l < "$RUNNER_TEMP/plugins.txt") plugins; $(ls "$libdir" | wc -l) files are in the bundle's lib folder"

          echo "--- a library's first line is its own name, which is not a dependency"
          leak=""
          for f in "$app/Contents/MacOS/gst-inspect" "$app"/Contents/Frameworks/*.dylib "$app"/Contents/MacOS/lib/*.dylib; do
            [ -f "$f" ] || continue
            if otool -L "$f" | tail -n +2 | grep -v "$(basename "$f")" | grep -E "/opt/homebrew|/usr/local|/Users/"; then echo "LEAK in $f"; leak=1; fi
            # (an old search path is searched first, so it makes the app load the machine's own copy)
            if otool -l "$f" | awk '/cmd LC_RPATH/{r=1} r&&/ path /{print $2; r=0}' | grep -v '^@'; then echo "OUTSIDE RPATH in $f"; leak=1; fi
          done
          [ -z "$leak" ] || exit 1

          # What Ferrite's bundle.rs sets: scan nothing (a path that does not exist), private registry.
          export GST_PLUGIN_SYSTEM_PATH_1_0="$libdir/no-plugin-scan" GST_PLUGIN_PATH_1_0="$libdir/no-plugin-scan"
          export GST_REGISTRY_1_0="$RUNNER_TEMP/gst-registry.bin"
          load_all() {   # $1 = label; loads each listed plugin the way Servo does, by path
            local bad="" n=0
            : > "$RUNNER_TEMP/dyld.txt"
            while read -r f; do
              n=$((n+1))
              if DYLD_PRINT_LIBRARIES=1 "$app/Contents/MacOS/gst-inspect" "$libdir/$f" >"$RUNNER_TEMP/one.txt" 2>&1; then
                cat "$RUNNER_TEMP/one.txt" >> "$RUNNER_TEMP/dyld.txt"
              else
                echo "WILL NOT LOAD: $f"; head -5 "$RUNNER_TEMP/one.txt"; bad=1
              fi
            done < "$RUNNER_TEMP/plugins.txt"
            [ -z "$bad" ] || { echo "$1: Servo would call exit(1)"; return 1; }
            echo "$1: all $n plugins load by path"
          }

          echo "--- with Homebrew installed (as on a developer's Mac), nothing may load from it"
          load_all "Homebrew present" || exit 1
          from_brew="$(grep -E "/opt/homebrew|/usr/local/(Cellar|opt|lib)" "$RUNNER_TEMP/dyld.txt" || true)"
          if [ -n "$from_brew" ]; then echo "$from_brew" | sort -u | head -20; echo "LOADED FROM HOMEBREW"; exit 1; fi
          echo "nothing loaded from Homebrew"

          echo "--- Homebrew moved away"
          sudo mv /opt/homebrew /opt/homebrew.hidden
          load_all "Homebrew hidden" || exit 1

          echo "--- elements an app needs (this scans the bundle's folder, which the app itself does not)"
          export GST_PLUGIN_SYSTEM_PATH_1_0="$libdir"; rm -f "$GST_REGISTRY_1_0"
          missing=""
          for el in qtdemux matroskademux playbin3 appsrc avdec_h264 opusdec opusparse vp9dec webrtcbin; do
            if "$app/Contents/MacOS/gst-inspect" "$el" >/dev/null 2>&1; then echo "ok   $el"; else echo "MISSING $el"; missing=1; fi
          done
          [ -z "$missing" ]

  bundle-smoke-windows:
    name: GStreamer bundle smoke test (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GStreamer and find it
        shell: pwsh
        run: |
          choco install -y pkgconfiglite gstreamer gstreamer-devel
          # The package installs under Program Files, not C:\gstreamer; the installer
          # records where in a machine-wide variable.
          $root = [Environment]::GetEnvironmentVariable('GSTREAMER_1_0_ROOT_MSVC_X86_64','Machine')
          if (-not $root) { $root = 'C:\Program Files\gstreamer\1.0\msvc_x86_64' }
          $root = $root.TrimEnd('\')
          if (-not (Test-Path "$root\lib\pkgconfig\glib-2.0.pc")) { throw "GStreamer's pkg-config files are not under $root" }
          "GSTREAMER_1_0_ROOT_MSVC_X86_64=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PKG_CONFIG_PATH=$root\lib\pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "$root\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          # Fail here, in a minute, not an hour into the build.
          $env:PKG_CONFIG_PATH = "$root\lib\pkgconfig"
          pkg-config --print-errors --modversion glib-2.0
          if ($LASTEXITCODE -ne 0) { throw "pkg-config cannot find GLib" }
          pkg-config --libs gstreamer-1.0

      - name: pkg-config finds every library the binding crates look for
        shell: pwsh
        run: |
          $root = $env:GSTREAMER_1_0_ROOT_MSVC_X86_64
          $bad = $false
          foreach ($lib in 'glib-2.0','gobject-2.0','gio-2.0','gstreamer-1.0','gstreamer-app-1.0','gstreamer-audio-1.0','gstreamer-base-1.0','gstreamer-play-1.0','gstreamer-sdp-1.0','gstreamer-video-1.0','gstreamer-webrtc-1.0') {
            $out = pkg-config --libs $lib 2>&1 | Out-String
            if ($LASTEXITCODE -ne 0) { "MISSING $lib : $out"; $bad = $true; continue }
            # The .pc files must point into the install, not at the machine that built it.
            # pkg-config writes a space in a path as "\ ", so a path may span several words.
            $dirs = [regex]::Matches($out, '-L((?:\\ |\S)+)') | ForEach-Object { $_.Groups[1].Value -replace '\\ ', ' ' }
            $outside = $dirs | Where-Object { ($_ -replace '/','\') -notlike "$root*" }
            if ($outside) { "OUTSIDE $lib : $($outside -join ' ')"; $bad = $true } else { "ok      $lib" }
          }
          if ($bad) { throw "pkg-config output is wrong" }

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Bundle, load Servo's plugins from it, with the installed GStreamer gone
        shell: pwsh
        run: |
          $root = $env:GSTREAMER_1_0_ROOT_MSVC_X86_64
          $stage = Join-Path $PWD 'smoke'
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item "$root\bin\gst-inspect-1.0.exe" "$stage\gst-inspect.exe"
          python scripts/bundle-gstreamer.py self-test
          python scripts/bundle-gstreamer.py windows $stage --root $root
          if ($LASTEXITCODE -ne 0) { throw "bundling failed" }
          $plugins = python scripts/bundle-gstreamer.py list windows
          "Servo lists $($plugins.Count) plugins"
          "size: {0:N0} MB" -f ((Get-ChildItem $stage -Recurse -File | Measure-Object Length -Sum).Sum / 1MB)
          # Take the installed copy out of reach.
          Rename-Item (Split-Path (Split-Path $root)) 'gstreamer.hidden'
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notlike '*gstreamer*' }) -join ';'
          Remove-Item Env:GSTREAMER_1_0_ROOT_MSVC_X86_64, Env:PKG_CONFIG_PATH -ErrorAction SilentlyContinue
          # What Ferrite's bundle.rs sets: scan nothing (a path that does not exist), private registry.
          $env:GST_PLUGIN_SYSTEM_PATH_1_0 = "$stage\no-plugin-scan"
          $env:GST_PLUGIN_PATH_1_0 = "$stage\no-plugin-scan"
          $env:GST_REGISTRY_1_0 = "$env:RUNNER_TEMP\gst-registry.bin"
          # Servo loads each listed plugin by file path from the folder of the exe. If one will
          # not load it calls exit(1) and says nothing.
          $bad = $false
          foreach ($f in $plugins) {
            & "$stage\gst-inspect.exe" "$stage\$f" *> "$env:RUNNER_TEMP\one.txt"
            if ($LASTEXITCODE -ne 0) { "WILL NOT LOAD: $f"; Get-Content "$env:RUNNER_TEMP\one.txt" -TotalCount 5; $bad = $true }
          }
          if ($bad) { throw "Servo would call exit(1)" }
          "all $($plugins.Count) plugins load by path"
          # Elements an app needs (this scans the folder, which the app itself does not).
          $env:GST_PLUGIN_SYSTEM_PATH_1_0 = $stage
          Remove-Item $env:GST_REGISTRY_1_0 -ErrorAction SilentlyContinue
          $missing = $false
          foreach ($el in 'qtdemux','matroskademux','playbin3','appsrc','avdec_h264','opusdec','opusparse','vp9dec','webrtcbin') {
            & "$stage\gst-inspect.exe" $el *> $null
            if ($LASTEXITCODE -eq 0) { "ok      $el" } else { "MISSING $el"; $missing = $true }
          }
          if ($missing) { throw "the bundle is missing elements" }
