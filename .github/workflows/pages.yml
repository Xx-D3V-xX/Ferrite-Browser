name: Site

# Publishes site/ to GitHub Pages. Manual, like CI: every deploy is an explicit
# click (Actions → Site → Run workflow).
#
# One-time setup, in the repository settings: Pages → Build and deployment →
# Source: "GitHub Actions". Until then the deploy job cannot publish.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Standard library only. The build fails on a broken internal link or
      # anchor, so a deploy cannot publish one.
      - name: Build
        run: python3 site/build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
