[package]
name = "ferrite-core"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
url = { workspace = true }
psl = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[features]
# Exposes the deterministic `FixedClock` to downstream crates' test suites.
# Off by default so test-only code never reaches a production build (R8/R9);
# in-crate tests get it for free via `cfg(test)`.
test-util = []
