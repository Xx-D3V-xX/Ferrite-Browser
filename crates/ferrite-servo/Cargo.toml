[package]
name = "ferrite-servo"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[features]
# Enable Servo engine integration:
#   cargo build -p ferrite-servo --features servo
#   cargo build -p ferrite-shell --features ferrite-servo/servo
servo = ["dep:servo", "dep:euclid", "dep:stylo_static_prefs"]
# Audio and video playback (and WebRTC) through GStreamer. Needs the GStreamer
# development files to build and its runtime and plugins next to the app, so it is off
# by default; see docs/COMMANDS.md.
media = ["servo", "servo/media-gstreamer"]

[dependencies]
ferrite-audit-log = { workspace = true }
uuid = { workspace = true }
raw-window-handle = { workspace = true }
winit = { workspace = true }
log = { workspace = true }
# Force aws_lc_rs backend — Servo's net component imports rustls::crypto::aws_lc_rs
# directly. Without this the workspace resolver selects `ring` and that import
# fails to compile.
rustls = { workspace = true }
url = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# Optional — only resolved when the `servo` feature is enabled.
# The crates.io package `servo`; Rust imports use `use servo::...`.
servo = { workspace = true, optional = true }
# The unit-typed `Scale` the engine's HiDPI API takes (same version the engine uses).
euclid = { version = "0.22", optional = true }
# The style engine's own preference table (`set_pref!`): `:has()` and other CSS
# features are switched on there, and the engine's `Preferences` does not expose
# them. Same version the engine uses (already in the lockfile).
stylo_static_prefs = { version = "=0.21.0", optional = true }
# cargo-machete can't see the `use servo::...` imports inside
# #[cfg(feature = "servo")] blocks without building with that feature
# enabled (it does static analysis without --with-metadata by default) —
# false-positive "unused dependency" without this.
[package.metadata.cargo-machete]
ignored = ["servo", "euclid", "stylo_static_prefs"]

[dev-dependencies]
# `examples/page_shot.rs` writes a PNG of what the engine rendered. Already in
# the lockfile (the engine itself decodes PNGs with it).
png = "0.17"

[[example]]
name = "media_probe"
required-features = ["media"]

[[example]]
name = "mse_probe"
required-features = ["media"]

[[example]]
name = "mse_libs_probe"
required-features = ["media"]

[[example]]
name = "capture_probe"
required-features = ["media"]

[[example]]
name = "sw_probe"
required-features = ["servo"]
