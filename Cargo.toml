[workspace]
members = [
  "crates/ferrite-core",
  "crates/ferrite-model",
  "crates/ferrite-shell",
  "crates/ferrite-audit-log",
  "crates/ferrite-servo",
  "crates/ferrite-ui",
  "crates/ferrite-agent",
  "crates/ferrite-ipi",
  "crates/ferrite-eval",
  "crates/ferrite-engine",
  "crates/ferrite-engine-servo",
]
resolver = "2"

# Single version source (docs/REBUILD_DIRECTIVE.md §7.3/T-101): every crate
# uses `dep.workspace = true` for every dependency it needs, even one used
# by only itself — the point is that a version bump happens in exactly one
# place, ever, so a duplicate/drifted version can't reappear by a crate
# quietly pinning its own. Verified against every crate's actual pre-A1
# Cargo.toml (docs/handoffs/a1.md cites this).
[workspace.dependencies]
# ── Cross-crate shared ──────────────────────────────────────────────────
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "1"
async-trait = "0.1"
# Trimmed from "full" (docs/TO-DO.md T-207 finding: grepped every
# `tokio::` call site in the workspace — runtime::Runtime::new(),
# sync::{mpsc,oneshot}, task::spawn, time::{sleep,timeout}, and the
# `#[tokio::test]` macro — none of `fs`/`net`/`io-util`/`process`/`signal`
# are used anywhere. "full" was pulling in all of them unused.
# C3d (downloads): "fs"/"io-util" added for real — `ferrite-ui`'s download
# manager streams a `reqwest` response body to disk via `tokio::fs::File` +
# `tokio::io::AsyncWriteExt::write_all`, the same "only what's actually used"
# discipline T-207 trimmed this list down to in the first place.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "io-util"] }
# C3d (downloads): "stream" added for real — `ferrite-ui`'s download manager
# reads the response body via `Response::bytes_stream()` (iterated with
# `iced::futures::StreamExt`, the same real `futures` crate iced already
# re-exports and this crate already imports elsewhere, so no new dependency
# is needed just to drive it) rather than buffering the whole body in memory
# first, so progress can be reported chunk by chunk.
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }
# Trimmed to what's actually used: DateTime::<Utc>::now() (needs "clock")
# and #[derive(Serialize/Deserialize)] on structs holding chrono types
# (needs "serde"). Default features pull in more (e.g. "wasmbind") that
# nothing here touches.
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
rusqlite = { version = "0.38", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
url = "2"

# ── ferrite-model ────────────────────────────────────────────────────────
# OS keyring for OLLAMA_API_KEY (docs/REBUILD_DIRECTIVE.md §10.1: the key
# comes from the env var or the OS keyring "and nowhere else" — no config
# file, no key file). Platform-native backends only: no dbus/secret-service
# daemon is pulled in, and nothing links on a platform we do not target.
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native", "linux-native"] }
# Home-directory resolution for the on-disk response cache at
# `~/.cache/ferrite-model/` (§10.3). `std` has no OS-neutral equivalent —
# `$HOME` is Unix-only and the justfile's `home_directory()` is a just
# builtin that Rust cannot call.
dirs = "5"

# ── ferrite-ipi ──────────────────────────────────────────────────────────
ammonia = "3"
regex = "1"
aes-gcm = "0.10"
rand = "0.8"
nix = { version = "0.28", features = ["net", "user"] }

# ── ferrite-servo ────────────────────────────────────────────────────────
raw-window-handle = "0.6"
winit = "0.30"
log = "0.4"
rustls = { version = "0.23", features = ["aws_lc_rs"] }
# The crates.io release of Servo (package `servo`, library `servo`). 0.6.0 replaces
# the git tag v0.0.5, whose script engine could free a compiled script that a
# stylesheet-blocked <script> was still waiting to run (a use-after-free that
# crashed Google pages); upstream traces that script now.
servo = { version = "=0.6.0" }

# ── ferrite-ui ───────────────────────────────────────────────────────────
# C1 (docs/handoffs/c01.md): "svg" adds the hand-authored icon set
# (crates/ferrite-ui/assets/icons/), rendered via iced_widget::svg. iced
# itself needs no matching feature flag here — ferrite-ui imports
# `iced_widget::svg` directly (as it already does for `iced_widget::image`,
# see lib.rs), not `iced::widget::svg`, and iced_widget's "svg" feature is a
# real Cargo feature on the `iced_widget` crate itself (confirmed against
# the pinned iced_widget 0.13.4's own Cargo.toml: `svg = ["iced_renderer/svg"]`)
# — enabling it here is sufficient regardless of what `iced`'s own "svg"
# feature (which only forwards to iced_widget/svg for `iced::widget::svg`
# call sites) is set to.
# C3a: "lazy" adds `iced_widget::responsive` (`lazy = ["ouroboros"]` on
# iced_widget 0.13.4's own Cargo.toml), imported directly the same way —
# `ferrite-ui` uses it to measure the Servo content area's real logical
# size on every layout pass instead of hand-replicating the chrome layout's
# heights/widths, so the Servo render buffer and mouse-event coordinates
# stay correct regardless of window size, panel visibility, or later
# layout changes (see lib.rs's `content_area_size` doc comment).
iced = { version = "0.13", features = ["tokio"] }
iced_widget = { version = "0.13", features = ["image", "svg", "lazy"] }
urlencoding = "2"
# New-tab hero (real quick-access-tile favicons): `iced_widget::image::Handle::
# from_rgba` only displays already-decoded raw RGBA bytes — it does not decode
# a fetched `.ico`/PNG itself, so a real image-decoding crate is needed for
# the first time in this workspace. `image` is small, extremely standard and
# widely audited, and already resolves to exactly this version (0.25.10) as a
# transitive dependency of `servo` (`arboard`/`embedder_traits`, gated
# behind the `servo` feature nothing here enables by default — confirmed via
# `cargo tree -p ferrite-ui -i image@0.25.10`), so pinning it here as a direct
# dependency does not add a new version to the graph, only a new direct edge
# to one already present. `default-features = false, features = ["ico"]`
# (which itself pulls in `bmp`+`png`, per the crate's own `Cargo.toml`) is the
# minimum needed to decode a real `/favicon.ico` response, which in practice
# serves either an actual multi-frame ICO container or a plain PNG at that
# path — `image::load_from_memory` sniffs the real format from its magic
# bytes, not the URL's extension, so both cases decode through the same call.
image = { version = "0.25", default-features = false, features = ["ico"] }

# ── path deps (in-workspace crates) ──────────────────────────────────────
ferrite-agent = { path = "crates/ferrite-agent" }
ferrite-audit-log = { path = "crates/ferrite-audit-log" }
ferrite-core = { path = "crates/ferrite-core" }
ferrite-engine = { path = "crates/ferrite-engine" }
ferrite-engine-servo = { path = "crates/ferrite-engine-servo" }
ferrite-ipi = { path = "crates/ferrite-ipi" }
ferrite-model = { path = "crates/ferrite-model" }
ferrite-servo = { path = "crates/ferrite-servo" }
ferrite-ui = { path = "crates/ferrite-ui" }

# ── Build profiles (docs/REBUILD_DIRECTIVE.md §7.2) ──────────────────────
[profile.dev]
opt-level = 0
debug = "line-tables-only"
incremental = true
codegen-units = 256
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 2

[profile.test]
inherits = "dev"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
panic = "unwind"

[profile.bench]
inherits = "release"
debug = "line-tables-only"
